name: Dashboard checks

on:
  push:
    branches: [main]
    paths: ["app.py", "views/**", "src/**", "tests/**", "requirements.txt", ".github/workflows/test.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py src views tests
      - run: python -m pytest -q
